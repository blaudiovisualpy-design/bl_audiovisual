<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Fondo oscuro -->
  <rect width="1200" height="630" fill="#0A0C0A"/>
  
  <!-- Detalles decorativos -->
  <circle cx="100" cy="100" r="200" fill="#1A1D1A" opacity="0.3"/>
  <circle cx="1100" cy="530" r="250" fill="#1A1D1A" opacity="0.3"/>
  
  <!-- Texto principal -->
  <text x="600" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" 
        font-size="120" font-weight="bold" fill="#F0D200" text-anchor="middle" letter-spacing="-2">
    BL AUDIOVISUAL
  </text>
  
  <!-- Subtítulo -->
  <text x="600" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" 
        font-size="32" fill="#FFFFFF" text-anchor="middle" opacity="0.9">
