  </text>
  
  <!-- Descripción -->
  <text x="600" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" 
        font-size="24" fill="#CCCCCC" text-anchor="middle">
